[package]
name = "aura-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Aura process supervisor and explicit-capability desktop portal backend"

[[bin]]
name = "aura-session"
path = "src/main.rs"

[dependencies]
aura-core = { path = "../aura-core" }
zbus = { workspace = true }
tokio = { workspace = true, features = ["process", "signal", "net", "fs", "io-util"] }
rustix = { version = "1.1.6", features = ["process"] }
futures-lite = "2.6.1"
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
