name: Rust and nested Wayland

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: sudo bash scripts/install-deps.sh --native --testing --xwayland
      - name: Verify X11 keyboard runtime
        run: python3 -c 'import ctypes; ctypes.CDLL("libxkbcommon-x11.so.0")'
      - name: Verify virtual X11 startup and failure cleanup
        run: python3 -m unittest discover -s scripts/tests -p test_xvfb.py -v
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Check repository structure
        run: python3 scripts/verify_workspace.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets and optional backends
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint optional native backend
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --locked
      - name: Test optional native backend policies
        run: cargo test --workspace --all-features --locked
      - name: Native feature selection and fail-closed startup
        run: python3 scripts/native_backend_smoke.py
      - name: Build real integration clients and capture consumers
        run: |
          cargo build --workspace --bins --examples --locked
      - name: Nested Wayland integration smoke
        run: python3 scripts/smoke_nested.py --software --no-build
      - name: Desktop lifecycle integration
        run: python3 scripts/integration_desktop.py --software --no-build
      - name: Session and real input integration
        run: python3 scripts/session_smoke.py --no-build
      - name: Live application catalog, activation and magnified Dock input
        run: python3 scripts/launcher_dock_smoke.py --no-build
      - name: Notification actions, desktop settings and layout shortcuts
        run: python3 scripts/desktop_controls_smoke.py --no-build
      - name: Saved preferences and notification history
        run: python3 scripts/preferences_history_smoke.py --no-build
      - name: Idle rendering, retained glass cache and window chrome
        run: python3 scripts/window_render_smoke.py --no-build
      - name: GPU pixel readback and GLES driver compilation
        run: |
          set -o pipefail
          mkdir -p target/driver-logs
          cargo test -p aura-render --test gpu --locked -- --ignored --nocapture 2>&1 | tee target/driver-logs/wgpu.log
          cargo test -p aura-render --test gles --locked -- --ignored --nocapture 2>&1 | tee target/driver-logs/gles.log
      - name: Asynchronous composed-frame PBO readback
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 EGL_PLATFORM=surfaceless cargo test -p aura-compositor --bin aura-compositor capture::tests::gles_pbo_capture_preserves_pack_state_and_reads_composed_rows --locked -- --ignored --exact --nocapture 2>&1 | tee target/driver-logs/pbo.log
      - name: Native and nested framebuffer orientation
        run: |
          set -o pipefail
          LIBGL_ALWAYS_SOFTWARE=1 EGL_PLATFORM=surfaceless cargo test -p aura-compositor --bin aura-compositor native_render_tests::composites_glass_scene_for_native_and_nested_output_orientations --locked -- --ignored --exact --nocapture 2>&1 | tee target/driver-logs/native-orientation.log
      - name: Private D-Bus services
        run: |
          dbus-run-session -- cargo test -p aura-session portal_dbus_lifecycle --locked -- --ignored
          dbus-run-session -- cargo test -p aura-session portal_dbus_consent_denial_and_request_cancellation --locked -- --ignored
          dbus-run-session -- cargo run -p aura-shell --example dbus_smoke --locked
      - name: Bounded and cancellable capture connection
        run: |
          set -o pipefail
          cargo test -p aura-session capture::tests::saturated_backlog_connect_is_bounded_and_cancellable --locked -- --ignored --exact 2>&1 | tee target/capture-connect.log
      - name: Real PipeWire exact-pixel roundtrip and node teardown
        run: |
          set -o pipefail
          python3 crates/aura-session/tests/pipewire_roundtrip.py 2>&1 | tee target/pipewire-roundtrip.log
      - name: ScreenCast consent, composed frames and revocation
        run: python3 scripts/screencast_smoke.py --no-build
      - name: Rootless XWayland and mixed X11/Wayland clients
        run: python3 scripts/xwayland_smoke.py
      - name: Save smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-smoke-logs
          path: |
            target/smoke-logs/
            target/xvfb-logs/
            target/native-backend-smoke-logs/
            target/desktop-smoke-logs/
            target/session-smoke-logs/
            target/launcher-dock-smoke-logs/
            target/desktop-controls-smoke-logs/
            target/preferences-history-smoke-logs/
            target/window-render-smoke-logs/
            target/screencast-smoke-logs/
            target/xwayland-smoke-logs/
            target/driver-logs/
            target/pipewire-roundtrip.log
            target/capture-connect.log
          if-no-files-found: ignore
